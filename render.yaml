# Render.com Deployment Configuration
# ====================================
# Free tier: 750 hours/month, auto-sleep after 15 min inactivity
# Deploy: Connect GitHub repo at https://dashboard.render.com/

services:
  - type: web
    name: ultimate-ai-trader
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --paper --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAPER_TRADING
        value: "true"
      - key: LINE_NOTIFY_TOKEN
        sync: false
      - key: BITFLYER_API_KEY
        sync: false
      - key: BITFLYER_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
