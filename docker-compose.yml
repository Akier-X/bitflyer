version: '3.8'

services:
  trader:
    build: .
    container_name: ai-trader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # bitFlyer API
      - BITFLYER_API_KEY=${BITFLYER_API_KEY}
      - BITFLYER_API_SECRET=${BITFLYER_API_SECRET}
      # LINE Messaging API
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      # Trading settings
      - PAPER_TRADING=false
      - TRADING_PAIRS=XRP_JPY,MONA_JPY,XLM_JPY
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
