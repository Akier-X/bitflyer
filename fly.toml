# Fly.io Deployment Configuration
# ================================
# Free tier: 3 shared-cpu-1x VMs, 256MB RAM
# Deploy: flyctl launch && flyctl deploy

app = "ultimate-ai-trader"
primary_region = "nrt"  # Tokyo

[build]
  dockerfile = "Dockerfile"

[env]
  PAPER_TRADING = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
